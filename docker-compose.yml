name: registro_produccion

x-registro-produccion-base: &registro-produccion-base
  image: registro_produccion:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  indufor:
    <<: *registro-produccion-base
    image: registro_produccion-indufor:latest
    container_name: registro_produccion_indufor
    environment:
      REGISTRO_ENV_FILE: /run/secrets/registro.env
    volumes:
      - /srv/env/registro_produccion/indufor.env:/run/secrets/registro.env:ro
      - /srv/env/registro_produccion/mysql-central-ca.pem:/run/secrets/mysql-central-ca.pem:ro
    ports:
      - "127.0.0.1:18004:8000"

  produccion_fg:
    <<: *registro-produccion-base
    image: registro_produccion-produccion-fg:latest
    container_name: registro_produccion_produccion_fg
    environment:
      REGISTRO_ENV_FILE: /run/secrets/registro.env
    volumes:
      - /srv/env/registro_produccion/produccion_fg.env:/run/secrets/registro.env:ro
      - /srv/env/registro_produccion/mysql-central-ca.pem:/run/secrets/mysql-central-ca.pem:ro
    ports:
      - "127.0.0.1:18005:8000"

  frontend_servinlgsm:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: registro_produccion-frontend-servinlgsm:latest
    restart: unless-stopped
    environment:
      BACKEND_HOST: produccion_fg
    depends_on:
      produccion_fg:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.registro-produccion-servin-redirect.redirectscheme.scheme: https
      traefik.http.routers.registro-produccion-servin-http.rule: "Host(`produccion.servinlgsm.com.ar`) || Host(`www.produccion.servinlgsm.com.ar`)"
      traefik.http.routers.registro-produccion-servin-http.entryPoints: http
      traefik.http.routers.registro-produccion-servin-http.middlewares: registro-produccion-servin-redirect
      traefik.http.routers.registro-produccion-servin-https.rule: "Host(`produccion.servinlgsm.com.ar`) || Host(`www.produccion.servinlgsm.com.ar`)"
      traefik.http.routers.registro-produccion-servin-https.entryPoints: https
      traefik.http.routers.registro-produccion-servin-https.priority: "100"
      traefik.http.routers.registro-produccion-servin-https.tls: "true"
      traefik.http.routers.registro-produccion-servin-https.tls.certresolver: letsencrypt
      traefik.http.routers.registro-produccion-servin-https.service: registro-produccion-servin
      traefik.http.services.registro-produccion-servin.loadbalancer.server.port: "80"

  frontend_indufor:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: registro_produccion-frontend-indufor:latest
    restart: unless-stopped
    environment:
      BACKEND_HOST: indufor
    depends_on:
      indufor:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.registro-produccion-indufor-redirect.redirectscheme.scheme: https
      traefik.http.routers.registro-produccion-indufor-http.rule: "Host(`produccion.indufor.com.ar`) || Host(`www.produccion.indufor.com.ar`)"
      traefik.http.routers.registro-produccion-indufor-http.entryPoints: http
      traefik.http.routers.registro-produccion-indufor-http.middlewares: registro-produccion-indufor-redirect
      traefik.http.routers.registro-produccion-indufor-https.rule: "Host(`produccion.indufor.com.ar`) || Host(`www.produccion.indufor.com.ar`)"
      traefik.http.routers.registro-produccion-indufor-https.entryPoints: https
      traefik.http.routers.registro-produccion-indufor-https.priority: "100"
      traefik.http.routers.registro-produccion-indufor-https.tls: "true"
      traefik.http.routers.registro-produccion-indufor-https.tls.certresolver: letsencrypt
      traefik.http.routers.registro-produccion-indufor-https.service: registro-produccion-indufor
      traefik.http.services.registro-produccion-indufor.loadbalancer.server.port: "80"
